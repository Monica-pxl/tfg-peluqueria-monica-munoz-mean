<section class="login-section d-flex justify-content-center align-items-center min-vh-100">
  <div class="login-card">

    <div class="d-flex justify-content-center mb-4" style="padding-bottom: 15px;">
      <a routerLink="/iniciar-sesion" 
         class="btn btn-pink px-5 py-2 fw-bold me-3">
        Iniciar Sesión
      </a>
      <a routerLink="/registrarse" 
         class="btn btn-outline-pink px-5 py-2 fw-bold">
        Registrarse
      </a>
    </div>

    <h2 class="text-center fw-bold mb-4" style="color: #ff69b4;">Iniciar Sesión</h2>
    <p class="text-center text-muted mb-5">
      Accede con tu cuenta para gestionar tus citas y servicios.
    </p>

    <form (ngSubmit)="iniciarSesion()" #loginForm="ngForm" novalidate>
      <div class="mb-4">
        <label for="email" class="form-label">Correo electrónico</label>
        <input
          type="email"
          id="email"
          [(ngModel)]="email"
          name="email"
          #emailInput="ngModel"
          class="form-control form-control-custom"
          [class.is-invalid]="emailInput.invalid && (emailInput.dirty || emailInput.touched)"
          placeholder="Introduce tu correo electrónico"
          required
          email
        >
        <div class="invalid-feedback" *ngIf="emailInput.errors?.['required'] && (emailInput.dirty || emailInput.touched)">
          El email es obligatorio.
        </div>
        <div class="invalid-feedback" *ngIf="emailInput.errors?.['email'] && (emailInput.dirty || emailInput.touched)">
          El formato del email no es válido.
        </div>
      </div>

      <div class="mb-5">
        <label for="password" class="form-label">Contraseña</label>
        <input
          type="password"
          id="password"
          [(ngModel)]="password"
          name="contraseña"
          #passwordInput="ngModel"
          class="form-control form-control-custom"
          [class.is-invalid]="passwordInput.invalid && (passwordInput.dirty || passwordInput.touched)"
          placeholder="Introduce tu contraseña"
          required
        >
        <div class="invalid-feedback" *ngIf="passwordInput.invalid && (passwordInput.dirty || passwordInput.touched)">
          La contraseña es obligatoria.
        </div>
      </div>

      <div *ngIf="errorServidor" class="alert alert-danger py-2 mb-3" role="alert">
        <i class="bi bi-exclamation-circle-fill me-2"></i>{{ errorServidor }}
      </div>

      <div class="text-center mt-5">
        <button
          type="submit"
          class="btn btn-login w-100"
          [disabled]="cargando || loginForm.invalid"
        >
          <span *ngIf="cargando" class="spinner-border spinner-border-sm me-2" role="status"></span>
          {{ cargando ? 'Entrando...' : 'Entrar' }}
        </button>
      </div>
    </form>

    <p class="text-center mt-4 mb-0 text-muted">
      ¿No tienes cuenta?
      <a [routerLink]="'/registrarse'" class="fw-bold" style="color: #ff69b4;">Regístrate aquí</a>
    </p>
  </div>
</section>
